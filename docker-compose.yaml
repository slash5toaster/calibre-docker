services:
  calibre-server:
    image: slash5toaster/calibre:9.13.0
    container_name: calibre-server
    # Optional - specify the uid and gid you would like to use instead of root
    # user: uid:gid
    ports:
      - 8321:8321/tcp
    volumes:
      - type: bind
        source: "/opt/Books/"
        target: "/opt/Books/"
    entrypoint: ["calibre-server", "--port", "8321", "/opt/Books/"]
    restart: 'unless-stopped'
